<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title> 
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;  
        }

        table{
            width: 400px;
            border-collapse: collapse;
            border: 2px solid rgb(11, 2, 71);
        }

        tr.linha{
            background-color: gray;
        }
        
        td{
            border: 1px solid black;
            padding: 8px;
        }
        td.dado{
            background-color: yellow;
        }

    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!-- HIERARQUIA DE TABELAS (simples)
     TABLE ROW = linha de tabela
     TABLE HEADER = cabeçalho da tabela
    TABLE DATA = dados da tabela -->
    <table>
        <tr> <!--Primeira linha -->
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
       </tr> 
    <tr class="linha"> <!--Segunda linha -->
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
    </tr>
    <tr><!--Terceira linha -->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
    </tr>
    <tr> <!--Quarta linha -->
            <td>A4</td>
            <td class="dado">B4</td>
            <td>C4</td>
    </tr>
    <tr>
            <td>A5</td>
            <td>B5</td>
            <td>C5</td>
    </tr>
     </table>
</body>
</html>
